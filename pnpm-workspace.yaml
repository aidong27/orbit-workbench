allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
# electron-builder 26.15.3 still resolves these vulnerable patch releases.
# Keep overrides within each upstream major so legacy minimatch consumers remain compatible.
overrides:
  fast-uri@3.1.3: 3.1.4
  tar@7.5.20: 7.5.21
  brace-expansion@5.0.7: 5.0.8
