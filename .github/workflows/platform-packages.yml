name: Platform packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Package macOS arm64
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS packages
        run: pnpm dist:mac

      - name: Verify packaged application renderer and preload
        run: 'release/mac-arm64/星轨工作台.app/Contents/MacOS/星轨工作台 --smoke-test'

      - name: Verify final macOS artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          zip="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$dmg"
          test -n "$zip"

          mount_point="$RUNNER_TEMP/orbit-workbench-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -readonly
          trap 'hdiutil detach "$mount_point" || true' EXIT
          "$mount_point/星轨工作台.app/Contents/MacOS/星轨工作台" --smoke-test
          test -s "$mount_point/星轨工作台.app/Contents/Resources/THIRD_PARTY_LICENSES.txt"
          test -s "$mount_point/星轨工作台.app/Contents/Resources/THIRD_PARTY_LICENSES.chromium.html"
          hdiutil detach "$mount_point"
          trap - EXIT

          zip_dir="$RUNNER_TEMP/orbit-workbench-zip"
          mkdir -p "$zip_dir"
          ditto -x -k "$zip" "$zip_dir"
          "$zip_dir/星轨工作台.app/Contents/MacOS/星轨工作台" --smoke-test
          test -s "$zip_dir/星轨工作台.app/Contents/Resources/THIRD_PARTY_LICENSES.txt"
          test -s "$zip_dir/星轨工作台.app/Contents/Resources/THIRD_PARTY_LICENSES.chromium.html"

          (
            cd release
            shasum -a 256 "$(basename "$dmg")" "$(basename "$zip")"
          ) > release/SHA256SUMS-macOS-arm64.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-workbench-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macOS-arm64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Package and launch Windows x64
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows packages
        run: pnpm dist:win

      - name: Verify unpacked app and NSIS installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-SmokeTest([string]$Executable) {
            $process = Start-Process -FilePath $Executable -ArgumentList "--smoke-test", "--disable-gpu" -PassThru
            try {
              $process | Wait-Process -Timeout 30 -ErrorAction Stop
              $process.Refresh()
              if ($process.ExitCode -ne 0) {
                throw "Packaged Windows renderer/preload smoke test failed (code $($process.ExitCode)): $Executable"
              }
            } finally {
              if (-not $process.HasExited) {
                & taskkill.exe /PID $process.Id /T /F | Out-Null
              }
            }
          }

          Assert-SmokeTest (Resolve-Path "release/win-unpacked/Orbit Workbench.exe")

          $installer = Get-Item "release/Orbit-Workbench-*-Windows-x64-Setup.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "OrbitWorkbench"
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDirectory" -PassThru -Wait
          if ($installation.ExitCode -ne 0) {
            throw "Silent NSIS installation failed (code $($installation.ExitCode))."
          }
          $installedApp = Join-Path $installDirectory "Orbit Workbench.exe"
          if (-not (Test-Path $installedApp)) {
            throw "NSIS installation did not create the expected application executable."
          }
          if (-not (Test-Path (Join-Path $installDirectory "resources/LICENSE.txt"))) {
            throw "NSIS installation is missing LICENSE.txt."
          }
          if (-not (Test-Path (Join-Path $installDirectory "resources/THIRD_PARTY_NOTICES.md"))) {
            throw "NSIS installation is missing THIRD_PARTY_NOTICES.md."
          }
          if (-not (Test-Path (Join-Path $installDirectory "resources/THIRD_PARTY_LICENSES.txt"))) {
            throw "NSIS installation is missing THIRD_PARTY_LICENSES.txt."
          }
          if (-not (Test-Path (Join-Path $installDirectory "resources/THIRD_PARTY_LICENSES.chromium.html"))) {
            throw "NSIS installation is missing Chromium license notices."
          }
          Assert-SmokeTest $installedApp

          $portable = Get-Item "release/Orbit-Workbench-*-Windows-x64-Portable.exe"
          if ($portable.Length -le 0) {
            throw "Portable artifact is empty."
          }
          Assert-SmokeTest $portable.FullName

          $checksumLines = Get-ChildItem "release/Orbit-Workbench-*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksumLines | Set-Content "release/SHA256SUMS-Windows-x64.txt" -Encoding utf8NoBOM

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-workbench-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS-Windows-x64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
