name: Platform packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Package macOS arm64
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS packages
        run: pnpm dist:mac

      - name: Verify packaged application renderer and preload
        run: 'release/mac-arm64/星轨工作台.app/Contents/MacOS/星轨工作台 --smoke-test'

      - name: Verify final macOS artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          zip="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$dmg"
          test -n "$zip"

          mount_point="$RUNNER_TEMP/orbit-workbench-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -readonly
          trap 'hdiutil detach "$mount_point" || true' EXIT
          "$mount_point/星轨工作台.app/Contents/MacOS/星轨工作台" --smoke-test
          test -s "$mount_point/星轨工作台.app/Contents/Resources/THIRD_PARTY_LICENSES.txt"
          test -s "$mount_point/星轨工作台.app/Contents/Resources/THIRD_PARTY_LICENSES.chromium.html"
          hdiutil detach "$mount_point"
          trap - EXIT

          zip_dir="$RUNNER_TEMP/orbit-workbench-zip"
          mkdir -p "$zip_dir"
          ditto -x -k "$zip" "$zip_dir"
          "$zip_dir/星轨工作台.app/Contents/MacOS/星轨工作台" --smoke-test
          test -s "$zip_dir/星轨工作台.app/Contents/Resources/THIRD_PARTY_LICENSES.txt"
          test -s "$zip_dir/星轨工作台.app/Contents/Resources/THIRD_PARTY_LICENSES.chromium.html"

          (
            cd release
            shasum -a 256 "$(basename "$dmg")" "$(basename "$zip")"
          ) > release/SHA256SUMS-macOS-arm64.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-workbench-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macOS-arm64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Package and launch Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse Windows package verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/verify-windows-package.ps1").Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw (($parseErrors | ForEach-Object Message) -join "`n")
          }
          Write-Host "PowerShell verifier syntax parsed successfully ($($tokens.Count) tokens)."

      - name: Resolve exact Windows artifact paths
        id: windows-artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = [string](Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -notmatch "^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$") {
            throw "Unsupported package version: $packageVersion"
          }
          $setupName = "Orbit-Workbench-$packageVersion-Windows-x64-Setup.exe"
          $portableName = "Orbit-Workbench-$packageVersion-Windows-x64-Portable.exe"
          "WINDOWS_SETUP_ARTIFACT=$setupName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PORTABLE_ARTIFACT=$portableName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "setup_path=release/$setupName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portable_path=release/$portableName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm dist:win *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/orbit-windows-build.log"
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            throw "Windows package build failed with exit code $buildExitCode."
          }

      - name: Verify Windows Job Object process isolation
        shell: pwsh
        run: pnpm verify:win-job -- --runner release/win-unpacked/resources/windows-job-runner.exe

      - name: Verify unpacked, NSIS and Portable packages
        shell: pwsh
        run: pnpm verify:win-package

      - name: Upload Windows verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-workbench-windows-x64-diagnostics
          path: |
            ${{ runner.temp }}/orbit-windows-build.log
            release/windows-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-workbench-windows-x64
          path: |
            ${{ steps.windows-artifacts.outputs.setup_path }}
            ${{ steps.windows-artifacts.outputs.portable_path }}
            release/SHA256SUMS-Windows-x64.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
