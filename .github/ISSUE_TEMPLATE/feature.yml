name: 功能建议
description: 描述清晰的用户场景、目标与边界
title: "[Feature] "
labels:
  - enhancement
  - triage
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认没有重复建议。
          required: true
        - label: 这个建议不会绕过 Grok Build 的认证或权限确认。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 用户场景
      description: 先说明遇到的问题、使用者和发生频率。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明理想体验；不必限定具体实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: dropdown
    id: platform
    attributes:
      label: 主要平台
      options:
        - Windows x64
        - macOS arm64
        - 两个平台
        - 与平台无关
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 安全、隐私与权限影响
      description: 是否新增文件、网络、凭据、持久化或工具执行能力？
    validations:
      required: true
