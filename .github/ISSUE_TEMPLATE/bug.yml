name: Bug 报告
description: 报告可复现的崩溃、界面或跨平台问题
title: "[Bug] "
labels:
  - bug
  - triage
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认没有重复报告。
          required: true
        - label: 我已删除密钥、私有代码、用户名和本地绝对路径。
          required: true
  - type: input
    id: app-version
    attributes:
      label: 星轨工作台版本
      placeholder: 例如 0.2.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows x64
        - macOS arm64
        - 从源码运行
    validations:
      required: true
  - type: input
    id: grok-version
    attributes:
      label: Grok Build CLI 版本
      description: 运行 `grok --version`，不要附带认证信息。
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简洁说明实际结果和影响。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
      description: 可选。请再次确认不含密钥、私有源码、用户名或绝对路径。
      render: text
